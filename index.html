<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkinMedical | Оцените нашу работу</title>
    <style>
        :root {
            --bg-dark: #011a14;
            --bg-mid: #047857;
            --bg-light: #a3e635;
            --bg-accent: #4ade80;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --glow-color: rgba(163, 230, 53, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, var(--bg-dark), var(--bg-mid), var(--bg-light), var(--bg-accent));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fade-slide {
            opacity: 0;
            transform: translateY(50px);
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            z-index: 2;
        }

        /* --- ЛОГОТИП БЕЗ ПЛАШКИ, С ПОДСВЕТКОЙ СНИЗУ --- */
        .logo-container {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 30px;
            background: radial-gradient(ellipse at center, var(--glow-color) 0%, transparent 70%);
            filter: blur(15px);
            animation: glowPulse 2s infinite alternate;
            z-index: -1;
        }

        .logo-container img {
            height: 90px;
            width: auto;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% { opacity: 0.5; transform: translateX(-50%) scaleX(0.8); }
            100% { opacity: 1; transform: translateX(-50%) scaleX(1.1); }
        }

        @keyframes floatLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px 25px;
            width: 100%;
            margin-bottom: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .glass-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 15px;
        }

        .step {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .step:last-child { margin-bottom: 0; }

        .step-num {
            background: #ffffff;
            color: var(--bg-dark);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .step-text {
            font-size: 16px;
            line-height: 1.5;
            font-weight: 500;
            opacity: 0.95;
        }

        .cta-button {
            background: #ffffff;
            color: var(--bg-dark);
            border: none;
            border-radius: 20px;
            padding: 24px;
            font-size: 19px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 40px var(--glow-color), 0 15px 30px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cta-button:hover::after { opacity: 0.3; }
        .cta-button:active {
            transform: scale(0.93);
            box-shadow: 0 0 20px var(--glow-color), inset 0 10px 20px rgba(0,0,0,0.2);
        }
        .cta-button:disabled {
            background: #64748b;
            color: #cbd5e1;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(2, 44, 34, 0.2);
            border-radius: 50%;
            border-top-color: var(--bg-dark);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--bg-dark);
            padding: 18px 36px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .toast.show { top: 30px; }

        footer {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
        }
        .social-icon:active { transform: scale(0.85); background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="toast" class="toast">
        <span>✔</span> Текст скопирован!
    </div>

    <main>
        <div class="logo-container fade-slide delay-1">
            <img src="logo.png" alt="SkinMedical">
        </div>

        <header class="fade-slide delay-2">
            <h1>Оцените нашу работу</h1>
            <p class="subtitle">Это займет не более 30 секунд</p>
        </header>

        <div class="glass-card fade-slide delay-3">
            <div class="card-title">
                <span>📋</span> Как оставить отзыв
            </div>
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-text">Нажмите кнопку ниже. Текст скопируется автоматически.</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-text">Откроется приложение 2ГИС на карточке клиники.</div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-text">Нажмите «Написать отзыв», выберите оценку и нажмите «Вставить».</div>
            </div>
        </div>

        <button id="actionBtn" class="cta-button fade-slide delay-4" onclick="copyAndGo()">
            <div id="btnSpinner" class="spinner"></div>
            <span id="btnText">Скопировать и перейти</span>
        </button>
    </main>

    <footer class="fade-slide delay-4">
        <a href="#" class="social-icon">✈️</a>
        <a href="#" class="social-icon">💬</a>
        <a href="#" class="social-icon">📍</a>
    </footer>

    <script>
        const openings = [
            "Шла на чистку с опаской, кожа капризная", "Ходил на лазер, думал будет жесть", "Пришла к дерматологу с сыпью, замучилась", "Пилинг спины это спасение", "Иглоукалывание это что-то",
            "Сделала биоревитализацию, кожа была как пергамент", "Привела маму к косметологу, ей 60", "Удалял папиллому на шее", "Ходила на трихолога, волосы лезли клочьями", "Пошла на пилинг, хотела убрать пятна",
            "Пришел на прием к хирургу с родинкой", "Фотоомоложение это бомба", "Массаж лица это отдельный вид удовольствия", "Сдавала анализы, все быстро", "Карбокситерапия немного покалывает, но терпимо",
            "Ходил на удаление бородавки на стопе, надоело", "Чистка лица это маст-хэв", "Консультация по пигментации прошла хорошо", "Мезотерапия для волос дала результат", "Сделала уколы красоты, лицо отдохнувшее",
            "Запись на чистку прошла быстро", "Пилинг лица сделали аккуратно", "Был на консультации у дерматолога, все объяснили", "Делал лазер, переживал, но зря", "Обратилась к трихологу, волосы сыпались"
        ];
        const middles = [
            "врач попался толковый, все объяснил", "оказалось терпимо, как резинкой щелкает", "врач посмотрел, все разложил по полочкам", "после тренировок вечно высыпало, а тут забыл", "сначала страшно, потом кайфуешь",
            "врач подобрала уколы, все аккуратно", "думала, будут втюхивать кучу всего", "минута делов, даже не почувствовал", "врач посмотрел на экране, все рассказал", "врач предупредила, что будет шелушиться",
            "врач осмотрел, все объяснил, успокоил", "морщины мелкие ушли, пигментация побледнела", "врач работает как скульптор", "взяли кровь, даже не заметила", "главное, что эффект есть",
            "врач нормальный, все сделал аккуратно", "делаю регулярно, кожа всегда чистая", "врач предложила несколько вариантов", "волосы стали гуще, меньше выпадают", "врач подобрала дозу, все объяснила"
        ];
        const results = [
            "кожа после вообще супер, поры чистые", "зажило реально быстро, даже не ожидал", "через неделю почти ничего не осталось", "спина гладкая, кайф", "шея не болит, сплю как убитый",
            "сейчас лицо напитанное, морщинки разгладились", "мама довольна, ходит теперь", "зажило без следа, рекомендую", "через два месяца волосы перестали сыпаться", "результат того стоит",
            "удалили лазером, даже не заметил", "кожа сейчас как в рекламе", "после курса лицо подтянулось, отеки ушли", "результаты на почту пришли, все четко", "кожа подтянулась, цвет выровнялся",
            "зажило быстро, ходить не больно", "косметолог попался хороший", "выбрала лазер, результат радует", "буду продолжать курс", "эффект естественный, не перекачанное"
        ];
        const conclusions = [
            "Приду ещё", "Советую всем", "Спасибо большое", "Впечатления отличные", "Всё супер",
            "Буду ходить", "Процветания вам", "Спасибо за работу", "Приятный сюрприз", "Буду советовать",
            "Отличное место", "Спасибо что помогаете", "Впечатления только хорошие", "Рекомендую", "Спасибо за труд",
            "Обязательно вернусь", "Спасибо за заботу", "Отличный сервис", "Приду снова", "Рекомендую всем"
        ];

        const targetUrl = "https://2gis.ru/surgut/firm/70000001075020592/tab/reviews";

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function capitalizeFirst(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

        function copyAndGo() {
            const btn = document.getElementById('actionBtn');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            if (btn.disabled) return;
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Формирую...";

            let p1 = getRandom(openings);
            let p2 = getRandom(middles);
            let p3 = getRandom(results);
            let p4 = getRandom(conclusions);

            let punct1 = Math.random() > 0.4 ? ". " : ", ";
            let punct2 = Math.random() > 0.4 ? ". " : ", ";
            let punct3 = Math.random() > 0.4 ? ". " : ", ";

            if (punct1 === ". ") p2 = capitalizeFirst(p2);
            if (punct2 === ". ") p3 = capitalizeFirst(p3);
            if (punct3 === ". ") p4 = capitalizeFirst(p4);

            let fullReview = p1 + punct1 + p2 + punct2 + p3 + punct3 + p4 + ".";

            navigator.clipboard.writeText(fullReview).then(() => {
                showToast();
                setTimeout(() => { window.location.href = targetUrl; }, 1500);
            }).catch(err => {
                alert("Скопируйте текст вручную:\n\n" + fullReview);
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Скопировать и перейти";
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }
    </script>
</body>
</html>
