<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinMedical | Оцените нашу работу</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ (СВЕТЛАЯ ИЗУМРУДНАЯ ТЕМА) --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #f0fdf4; /* Очень светлый зеленый фон */
            background-image: radial-gradient(circle at 50% 0%, #dcfce7 0%, #f0fdf4 70%);
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- КОНТЕЙНЕР --- */
        .main-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: superSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes superSlideUp {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- ЛОГОТИП --- */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease 0.3s forwards;
            opacity: 0;
        }
        .logo-container img {
            max-width: 220px;
            height: auto;
            /* Убрал инверсию, чтобы логотип был зеленым, как на картинке */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        /* --- КАРТОЧКА --- */
        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(22, 163, 74, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Декоративная зеленая линия сверху */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            text-align: center;
            color: #6b7280;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* --- ШАГИ --- */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #f3f4f6;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .step-item:nth-child(1) { animation-delay: 0.4s; }
        .step-item:nth-child(2) { animation-delay: 0.5s; }
        .step-item:nth-child(3) { animation-delay: 0.6s; }

        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        .step-item:hover {
            border-color: #22c55e;
            background: #f0fdf4;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(22, 163, 74, 0.05);
        }

        .step-num {
            background: #dcfce7;
            color: #15803d;
            font-weight: 800;
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .step-text {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.4;
        }
        .step-text b { color: #111827; }

        /* --- КНОПКА --- */
        .action-btn {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            border: none;
            padding: 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(22, 163, 74, 0.4);
        }

        .action-btn:active { transform: translateY(1px); }
        .action-btn:disabled { background: #9ca3af; color: #fff; cursor: not-allowed; transform: none; box-shadow: none; }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- ТОСТ --- */
        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #16a34a;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(22, 163, 74, 0.4);
            transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show { top: 30px; }

        /* Декор фона (зеленые пятна) */
        .bg-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: #22c55e;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }
        .blob-1 { top: -150px; left: -150px; animation: float 10s ease-in-out infinite; }
        .blob-2 { bottom: -150px; right: -150px; animation: float 12s ease-in-out infinite reverse; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div id="toast" class="toast">
        <span>✔</span> Текст отзыва скопирован!

    <div class="main-wrapper">

        <div class="card">
            <h1>Оцените нашу работу</h1>

                </div>

                    <div class="step-num">2</div>
                    <div class="step-text">Откроется приложение <b>2ГИС</b> на карточке клиники.</div>
                </div>
                <div class="step-item">
                    <div class="step-num">3</div>
                    <div class="step-text">Нажмите <b>«Написать отзыв»</b>, выберите оценку и нажмите <b>«Вставить»</b> в поле ввода.</div>
                </div>
            </div>

            <button id="actionBtn" class="action-btn" onclick="copyAndGo()">
                <div id="btnSpinner" class="spinner"></div>
                <span id="btnText">Скопировать и перейти</span>
                <span id="btnArrow">➔</span>
            </button>
        </div>
    </div>

    <script>

            "Посетил клинику, остались только положительные эмоции.", "Давно искал хорошее место, и вот нашел.", "Записался на процедуру, очень переживал.", "Была на консультации, хочу отметить профессионализм.", "Очень рад, что попал именно сюда.",

            "Удалял кератому лазером.", "Приходил на консультацию невролога.", "Делал пилинг PRX-T33.", "Сделал процедуру RF-лифтинга.", "Удалял папиллому на шее.",

            "Записался на консультацию к косметологу.", "Сделал процедуру для укрепления волос.", "Прошел осмотр у хирурга.", "Делал чистку лица перед событием.", "Сделал биоревитализацию для глаз.",
            "Прошел курс плазмотерапии.", "Делал пилинг для выравнивания тона.", "Записался на прием к дерматологу.", "Сделал процедуру для подтяжки овала.", "Прошел консультацию по уходу за кожей."
        ];

        const details = [
            "Врач всё подробно объяснил, разложил по полочкам.", "На ресепшене встретили очень вежливо, предложили подождать.", "Сама процедура прошла комфортно, боли почти не было.", "Специалист учел все особенности кожи и дал советы.", "Обезболивание сработало отлично, дискомфорта не было.",
            "В кабинете чисто, стерильно, всё аккуратно.", "Врач ответил на все вопросы, ничего не скрывал.", "Процедура заняла меньше времени, чем ожидалось.", "Сделали всё очень деликатно и профессионально.", "Перед началом подробно рассказали о препарате.",
            "Ничего лишнего не навязывали, только то, что нужно.", "Внимательно выслушали все жалобы.", "Работал настоящий профессионал своего дела.", "Обстановка спокойная, не было спешки.", "Всё прошло в комфортной и дружелюбной атмосфере.",

            "Специалист нашел подход, успокоил.", "Процедура прошла быстро и безболезненно.", "Атмосфера в клинике очень расслабляющая.", "Врач дал много полезных советов на будущее.", "Чувствовалась забота о каждом клиенте.",
            "Все инструменты стерильные, одноразовые.", "Никакой спешки, всё делали качественно.", "Врач очень внимательный и чуткий.", "Понравилось, что не пришлось долго ждать.", "Всё четко по записи, без задержек.",
            "Процедура прошла с минимальным дискомфортом.", "Врач объяснил каждый шаг.", "В клинике очень уютно и светло.", "Персонал приветливый и отзывчивый.", "Сделали всё с первого раза и качественно.",
            "Врач учел все пожелания.", "Процедура прошла на высшем уровне.", "Очень понравилось отношение к клиентам.", "Всё сделали аккуратно и быстро.", "Врач дал рекомендации по домашнему уходу."
        ];

        const results = [
            "Результат заметен уже через несколько дней.", "Кожа стала заметно чище и ровнее.", "Проблема, которая беспокоила годами, решилась.", "Волосы перестали выпадать, стали гуще.", "Пигментные пятна заметно побледнели.",
            "Заживление прошло быстро, следов не осталось.", "Отеки спали, лицо выглядит отдохнувшим.", "Высыпания прошли, кожа стала гладкой.", "Самочувствие значительно улучшилось.", "Морщинки разгладились, кожа сияет.",
            "Удалось избавиться от бородавки без шрамов.", "Результат превзошел все ожидания.", "Эффект сохраняется уже долгое время.", "Тон кожи выровнялся, выглядит здоровым.", "Поры сузились, кожа дышит.",
            "Кожа стала более упругой и эластичной.", "Покраснения прошли, цвет лица ровный.", "Волосы стали крепче и гуще.", "Боль в спине прошла.", "Головные боли больше не беспокоят.",

        const targetUrl = "https://2gis.ru/surgut/firm/70000001075020592/tab/reviews";

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function copyAndGo() {
            const btn = document.getElementById('actionBtn');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const btnArrow = document.getElementById('btnArrow');

            if (btn.disabled) return;
            
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Формирую...";
            btnArrow.style.display = "none";

            // Собираем уникальный отзыв
            const part1 = getRandom(openings);
            const part2 = getRandom(procedures);
            const part3 = getRandom(details);
            const part4 = getRandom(results);
            const part5 = getRandom(conclusions);

            let fullReview = `${part1} ${part2} ${part3} ${part4} ${part5}`;

            navigator.clipboard.writeText(fullReview).then(() => {
                showToast();
                setTimeout(() => { window.location.href = targetUrl; }, 1500);
            }).catch(err => {
                alert("Скопируйте текст вручную:\n\n" + fullReview);
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Скопировать и перейти";
                btnArrow.style.display = "inline";
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }
    </script>
</body>
</html>
