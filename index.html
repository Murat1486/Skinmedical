<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-dark: #011a14;
            --bg-mid: #047857;
            --bg-light: #a3e635;
            --bg-accent: #4ade80;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --glow-color: rgba(163, 230, 53, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, var(--bg-dark), var(--bg-mid), var(--bg-light), var(--bg-accent));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fade-slide {
            opacity: 0;
            transform: translateY(50px);
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            z-index: 2;
        }

        /* Логотип без плашки, с пульсирующей подсветкой снизу */
        .logo-container {
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 30px;
            background: radial-gradient(ellipse at center, var(--glow-color) 0%, transparent 70%);
            filter: blur(15px);
            animation: glowPulse 2s infinite alternate;
            z-index: -1;
        }

        .logo-container img {
            height: 80px;
            width: auto;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% { opacity: 0.5; transform: translateX(-50%) scaleX(0.8); }
            100% { opacity: 1; transform: translateX(-50%) scaleX(1.1); }
        }

        @keyframes floatLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .choice-group {
            display: none;
            width: 100%;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease forwards;
        }

        .choice-group.active { display: block; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .choice-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 8px;
            text-align: center;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .choice-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .choice-btn:hover, .choice-btn.active {
            background: #ffffff;
            color: var(--bg-dark);
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 8px;
        }

        .step { display: flex; gap: 12px; margin-bottom: 10px; }
        .step:last-child { margin-bottom: 0; }

        .step-num {
            background: #ffffff;
            color: var(--bg-dark);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 12px;
            flex-shrink: 0;
        }

        .step-text { font-size: 13px; line-height: 1.3; font-weight: 500; }

        .cta-button {
            background: #ffffff;
            color: var(--bg-dark);
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px var(--glow-color), 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .cta-button:active { transform: scale(0.95); }
        .cta-button:disabled { background: #64748b; color: #cbd5e1; box-shadow: none; transform: none; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(2, 44, 34, 0.2);
            border-radius: 50%;
            border-top-color: var(--bg-dark);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--bg-dark);
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show { top: 20px; }
    </style>
</head>
