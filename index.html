<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkinMedical | Оцените нашу работу</title>
    <style>
        :root {
            --deep-green: #064e3b;
            --neon-green: #a3e635;
            --bright-green: #22c55e;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--deep-green) 0%, var(--bright-green) 50%, var(--neon-green) 100%);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            z-index: 2;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in.show {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            opacity: 0;
            animation: revealText 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        @keyframes revealText {
            0% { opacity: 0; filter: blur(5px); transform: scale(0.95); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        .subtitle {
            font-size: 16px;
            font-weight: 400;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            opacity: 0;
            animation: fadeInText 1s ease forwards 0.6s;
        }

        @keyframes fadeInText {
            to { opacity: 0.9; }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .glass-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.25);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step-num {
            background: var(--text-color);
            color: var(--deep-green);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 14px;
            flex-shrink: 0;
        }

        .step-text {
            font-size: 15px;
            line-height: 1.4;
            opacity: 0.95;
        }

        .cta-button {
            background: var(--text-color);
            color: var(--deep-green);
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .cta-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6), inset 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .cta-button:disabled {
            background: #cbd5e1;
            color: #64748b;
            box-shadow: none;
            transform: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(6, 78, 59, 0.3);
            border-radius: 50%;
            border-top-color: var(--deep-green);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            opacity: 0;
            animation: fadeInText 1s ease forwards 1s;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: background 0.2s, transform 0.2s;
        }

        .social-icon:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.9);
        }

        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--deep-green);
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            top: 30px;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">
        <span>✔</span> Текст скопирован!
    </div>

    <main>
        <header class="fade-in show">
            <h1>Оцените нашу работу</h1>
            <p class="subtitle">Это займет не более 30 секунд</p>
        </header>

        <div class="glass-card fade-in">
            <div class="card-title">
                <span>📋</span> Как оставить отзыв
            </div>
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-text">Нажмите кнопку ниже. Текст скопируется автоматически.</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-text">Откроется 2ГИС на карточке клиники.</div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-text">Нажмите «Написать отзыв», выберите оценку и нажмите «Вставить».</div>
            </div>
        </div>

        <button id="actionBtn" class="cta-button fade-in" onclick="copyAndGo()">
            <div id="btnSpinner" class="spinner"></div>
            <span id="btnText">Скопировать и перейти</span>
        </button>
    </main>

    <footer class="fade-in">
        <a href="#" class="social-icon">✈️</a>
        <a href="#" class="social-icon">💬</a>
        <a href="#" class="social-icon">📍</a>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in:not(header)').forEach((el) => {
            observer.observe(el);
        });

        // --- БАЗА ОТЗЫВОВ (БЕЗ ЗНАКОВ ПРЕПИНАНИЯ В КОНЦЕ) ---
        
        const openings = [
            "Запись на чистку прошла быстро", "Пилинг лица сделали хорошо", "Консультация дерматолога прошла отлично", "Лазерное удаление прошло спокойно", "Прием у трихолога был полезным",
            "Биоревитализацию сделали аккуратно", "Иглоукалывание помогло", "Плазмотерапия для волос прошла комфортно", "Пилинг спины сделали качественно", "Удаление бородавки прошло гладко",
            "Уколы красоты дали результат", "Прием у хирурга прошел четко", "Фотоомоложение понравилось", "Осмотр у дерматолога прошел хорошо", "Сдача анализов прошла быстро",
            "Карбокситерапия понравилась", "Чистка лица прошла супер", "Консультация по пигментации была информативной", "Мезотерапия для волос дала эффект", "Процедура для сужения пор прошла отлично",
            "Прием у невролога прошел внимательно", "Удаление родинки прошло без проблем", "Пилинг для выравнивания тона сделали хорошо", "Лазерная шлифовка прошла нормально", "Консультация косметолога помогла",
            "Удаление папилломы прошло быстро", "Биоревитализация для глаз прошла отлично", "Иглоукалывание для спины помогло", "Консультация трихолога прошла подробно", "Процедура для подтяжки лица понравилась",
            "Уколы для увлажнения сделали аккуратно", "Прием у дерматолога все объяснил", "Чистка спины прошла хорошо", "Удаление кератомы прошло гладко", "Фотоомоложение для лица сделали качественно",
            "Прием у хирурга был полезным", "Процедура для волос прошла комфортно", "Сдача крови прошла безболезненно", "Консультация по уходу за кожей прошла отлично", "Лазерное удаление на лице прошло спокойно",
            "Иглоукалывание для шеи помогло", "Пилинг тела сделали отлично", "Прием у косметолога был четким", "Процедура для кожи вокруг глаз понравилась", "Удаление бородавки на стопе прошло хорошо",
            "Консультация невролога прошла нормально", "Уколы для лица дали хороший эффект", "Чистка лица перед событием прошла отлично", "Плазмотерапия прошла комфортно", "Прием у трихолога все объяснил"
        ];

        const middles = [
            "врач всё подробно объяснил без воды", "на ресепшене встретили вежливо", "было не больно и почти не чувствовалось", "косметолог учел все пожелания", "обезболивание сработало на ура",
            "в кабинете чисто и стерильно", "ответили на все вопросы", "процедура заняла меньше времени", "сделали всё аккуратно", "рассказали про препарат",
            "ничего лишнего не навязывали", "выслушали все жалобы", "работал профессионал", "не было спешки", "атмосфера комфортная",
            "оборудование современное", "уход подобрали идеально", "подход индивидуальный", "провели диагностику", "показали на экране",
            "все прошло спокойно", "врач очень внимательный", "персонал приветливый", "всё четко по записи", "объяснили каждый шаг",
            "сделали всё быстро", "в клинике уютно", "чувствуется опыт", "все инструменты стерильные", "никакой суеты",
            "всё прошло гладко", "врач все показал", "внимательное отношение", "понравился сервис", "процедура прошла легко",
            "всё объяснили заранее", "персонал отзывчивый", "чистота и порядок", "сделали с первого раза", "врач учел нюансы",
            "всё прошло без стресса", "анестезия подействовала сразу", "в клинике светло", "врач грамотный", "процедура прошла комфортно",
            "все прошло без проблем", "внимательные администраторы", "приняли вовремя", "всё сделали качественно", "врач помог"
        ];

        const results = [
            "кожа стала чище", "результат виден сразу", "проблема ушла", "волосы перестали лезть", "пятна побледнели",
            "зажило быстро", "отеки спали", "высыпаний нет", "стало легче", "морщинки разгладились",
            "бородавки нет", "результат супер", "эффект держится", "тон ровный", "поры сузились",
            "кожа упругая", "покраснения прошли", "волосы гуще", "боль прошла", "головные боли прошли",
            "кожа сияет", "результат радует", "кожа гладкая", "волосы крепче", "сон нормализовался",
            "потливость снизилась", "цвет лица выровнялся", "кожа дышит", "воспаления прошли", "ноготь восстановился",
            "кожа свежая", "всё зажило", "морщины стали меньше", "проблема решена", "эффект отличный",
            "кожа лучше", "всё прошло", "результат есть", "волосы здоровее", "кожа мягкая",
            "овал лица четче", "звездочки бледнее", "кожа ровнее", "волосы блестят", "боль ушла",
            "всё супер", "результат хороший", "кожа чистая", "эффект превзошел ожидания", "стало намного лучше"
        ];

        const conclusions = [
            "приду ещё", "советую всем", "спасибо большое", "впечатления отличные", "всё супер",
            "буду ходить", "процветания вам", "спасибо за работу", "приятный сюрприз", "буду советовать",
            "отличное место", "спасибо что помогаете", "впечатления только хорошие", "рекомендую", "спасибо за труд",
            "обязательно вернусь", "спасибо за заботу", "отличный сервис", "приду снова", "рекомендую всем",
            "очень хорошо", "все понравилось", "спасибо за внимание", "радостные эмоции", "супер",
            "буду постоянным клиентом", "спасибо за помощь", "отличный подход", "приятные впечатления", "спасибо",
            "отлично", "класс", "молодцы", "так держать", "спасибо за всё",
            "очень приятно", "всё понравилось", "отличная работа", "спасибо за качество", "буду обращаться",
            "вы лучшие", "спасибо за профессионализм", "рекомендую от души", "результат радует", "всё отлично",
            "спасибо за чуткость", "приду ещё раз", "отличные специалисты", "все супер", "спасибо огромное"
        ];

        const targetUrl = "https://2gis.ru/surgut/firm/70000001075020592/tab/reviews";

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function copyAndGo() {
            const btn = document.getElementById('actionBtn');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            if (btn.disabled) return;

            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Формирую...";

            let p1 = getRandom(openings);
            let p2 = getRandom(middles);
            let p3 = getRandom(results);
            let p4 = getRandom(conclusions);

            // Случайно выбираем знак препинания (точка или запятая)
            let punct1 = Math.random() > 0.4 ? ". " : ", ";
            let punct2 = Math.random() > 0.4 ? ". " : ", ";
            let punct3 = Math.random() > 0.4 ? ". " : ", ";

            // Если ставим точку, следующее слово делаем с большой буквы
            if (punct1 === ". ") p2 = capitalizeFirst(p2);
            if (punct2 === ". ") p3 = capitalizeFirst(p3);
            if (punct3 === ". ") p4 = capitalizeFirst(p4);

            // В самом конце всегда ставим точку
            let fullReview = p1 + punct1 + p2 + punct2 + p3 + punct3 + p4 + ".";

            navigator.clipboard.writeText(fullReview).then(() => {
                showToast();
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1500);
            }).catch(err => {
                alert("Скопируйте текст вручную:\n\n" + fullReview);
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Скопировать и перейти";
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }
    </script>
</body>
</html>
