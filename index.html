<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkinMedical | Оцените нашу работу</title>
    <style>
        :root {
            --bg-dark: #011a14;
            --bg-mid: #047857;
            --bg-light: #a3e635;
            --bg-accent: #4ade80;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --glow-color: rgba(163, 230, 53, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, var(--bg-dark), var(--bg-mid), var(--bg-light), var(--bg-accent));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fade-slide {
            opacity: 0;
            transform: translateY(50px);
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            z-index: 2;
        }

        .logo-container {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 30px;
            background: radial-gradient(ellipse at center, var(--glow-color) 0%, transparent 70%);
            filter: blur(15px);
            animation: glowPulse 2s infinite alternate;
            z-index: -1;
        }

        .logo-container img {
            height: 90px;
            width: auto;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% { opacity: 0.5; transform: translateX(-50%) scaleX(0.8); }
            100% { opacity: 1; transform: translateX(-50%) scaleX(1.1); }
        }

        @keyframes floatLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .choice-group {
            display: none;
            width: 100%;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease forwards;
        }

        .choice-group.active {
            display: block;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 10px;
            text-align: center;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .choice-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .choice-btn:hover, .choice-btn.active {
            background: #ffffff;
            color: var(--bg-dark);
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px;
            width: 100%;
            margin-bottom: 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 10px;
        }

        .step {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .step:last-child { margin-bottom: 0; }

        .step-num {
            background: #ffffff;
            color: var(--bg-dark);
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 13px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .step-text {
            font-size: 14px;
            line-height: 1.4;
            font-weight: 500;
            opacity: 0.95;
        }

        .cta-button {
            background: #ffffff;
            color: var(--bg-dark);
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-size: 18px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 40px var(--glow-color), 0 15px 30px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .cta-button:active {
            transform: scale(0.93);
        }
        .cta-button:disabled {
            background: #64748b;
            color: #cbd5e1;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(2, 44, 34, 0.2);
            border-radius: 50%;
            border-top-color: var(--bg-dark);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--bg-dark);
            padding: 18px 36px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .toast.show { top: 30px; }

        footer {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">
        <span>✔</span> Текст скопирован!
    </div>

    <main>
        <div class="logo-container fade-slide delay-1">
            <img src="logo.png" alt="SkinMedical">
        </div>

        <header class="fade-slide delay-2">
            <h1>Оцените нашу работу</h1>
            <p class="subtitle">Это займет не более 30 секунд</p>
        </header>

        <!-- Шаг 1: Выбор пола -->
        <div class="choice-group active" id="genderGroup">
            <div class="choice-title">Шаг 1. Кто вы?</div>
            <div class="buttons-grid">
                <button class="choice-btn" onclick="selectGender('male', this)">👨‍⚕️ Парень</button>
                <button class="choice-btn" onclick="selectGender('female', this)">👩‍⚕️ Девушка</button>
            </div>
        </div>

        <!-- Шаг 2: Выбор врача -->
        <div class="choice-group" id="doctorGroup">
            <div class="choice-title">Шаг 2. У какого врача были?</div>
            <div class="buttons-grid">
                <button class="choice-btn" onclick="selectDoctor('dermatologist', this)">Дерматолог</button>
                <button class="choice-btn" onclick="selectDoctor('cosmetologist', this)">Косметолог</button>
                <button class="choice-btn" onclick="selectDoctor('trichologist', this)">Трихолог</button>
                <button class="choice-btn" onclick="selectDoctor('surgeon', this)">Хирург</button>
                <button class="choice-btn" onclick="selectDoctor('neurologist', this)">Невролог</button>
                <button class="choice-btn" onclick="selectDoctor('oncologist', this)">Онколог</button>
                <button class="choice-btn" onclick="selectDoctor('other', this)">Другой врач</button>
            </div>
        </div>

        <!-- Инструкция -->
        <div class="glass-card fade-slide delay-3">
            <div class="card-title">
                <span>📋</span> Как оставить отзыв
            </div>
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-text">Выберите пол и врача выше.</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-text">Нажмите кнопку ниже, чтобы скопировать текст.</div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-text">Вставьте текст в отзыв в 2ГИС.</div>
            </div>
        </div>

        <button id="actionBtn" class="cta-button fade-slide delay-4" onclick="copyAndGo()" disabled>
            <div id="btnSpinner" class="spinner"></div>
            <span id="btnText">Выберите пол и врача</span>
        </button>
    </main>

    <footer class="fade-slide delay-4">
        <a href="#" class="social-icon">✈️</a>
        <a href="#" class="social-icon">💬</a>
        <a href="#" class="social-icon">📍</a>
    </footer>

    <script>
        let selectedGender = null;
        let selectedDoctor = null;

        // --- БАЗА ДАННЫХ ---

        // 1. Мужской род
        const maleData = {
            openings: ["Записался", "Пришел", "Ходил", "Был", "Обратился"],
            closings: ["Спасибо!", "Рекомендую.", "Буду ходить.", "Все супер.", "Очень доволен."]
        };

        // 2. Женский род
        const femaleData = {
            openings: ["Записалась", "Пришла", "Ходила", "Была", "Обратилась"],
            closings: ["Спасибо!", "Рекомендую.", "Буду ходить.", "Все супер.", "Очень довольна."]
        };

        // 3. Тексты для врачей (универсальные, без рода)
        const doctorTexts = {
            dermatologist: [
                "Врач всё подробно объяснил, разложил по полочкам. Назначил лечение, которое реально помогло. Кожа стала чище.",
                "Очень внимательный врач. Посмотрел, задал вопросы, выписал мазь. Через неделю почти ничего не осталось.",
                "Профессиональный подход. Всё объяснил, показал на экране. Лечение помогло, высыпания прошли."
            ],
            cosmetologist: [
                "Косметолог учла все пожелания. Процедура прошла комфортно, без боли. Кожа после — супер, поры чистые.",
                "Сделала чистку лица, всё прошло отлично. Врач попалась толковая, всё объяснила. Кожа дышит.",
                "Очень довольна результатом. Врач подобрала уход, всё аккуратно. Лицо выглядит свежим."
            ],
            trichologist: [
                "Врач посмотрел кожу головы на экране, всё рассказал. Выписал витамины. Через два месяца волосы перестали сыпаться.",
                "Обратилась с выпадением волос. Врач назначил лечение, всё объяснил. Результат есть, волосы крепче.",
                "Профессиональный трихолог. Провёл диагностику, назначил уход. Волосы стали гуще."
            ],
            surgeon: [
                "Врач осмотрел, всё объяснил, успокоил. Удалил родинку лазером, даже не заметил. Шов аккуратный.",
                "Быстро и без боли. Хирург всё сделал за пару минут. Зажило без проблем.",
                "Пришел с родинкой, врач всё объяснил. Удалили быстро, следов не осталось."
            ],
            neurologist: [
                "Иглоукалывание помогло снять напряжение. Врач нашел нужные точки. Шея не болит, сплю лучше.",
                "Врач профессионал. Прошёл курс иглоукалывания, головные боли прошли. Чувствую себя намного лучше.",
                "Очень помогло. Врач всё объяснил, нашёл болевые точки. После сеанса легкость."
            ],
            oncologist: [
                "Врач очень внимательный. Осмотрел родинки, всё объяснил. Успокоил, сказал, что всё хорошо.",
                "Пришел на проверку родинки. Врач всё посмотрел, дал заключение. Ничего лишнего не навязывал.",
                "Профессиональный онколог. Провёл диагностику, всё рассказал. Доволен подходом."
            ],
            other: [
                "Врач всё подробно объяснил. Процедура прошла хорошо, результатом доволен. Спасибо!",
                "Отличный специалист. Всё сделал аккуратно, без боли. Рекомендую.",
                "Очень понравился подход. Врач внимательный, всё рассказал. Результат есть."
            ]
        };

        // Функция выбора пола
        function selectGender(gender, btn) {
            selectedGender = gender;
            
            document.querySelectorAll('#genderGroup .choice-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('doctorGroup').classList.add('active');
            checkReady();
        }

        // Функция выбора врача
        function selectDoctor(doctor, btn) {
            selectedDoctor = doctor;

            document.querySelectorAll('#doctorGroup .choice-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            checkReady();
        }

        // Проверка, всё ли выбрано
        function checkReady() {
            if (selectedGender && selectedDoctor) {
                const actionBtn = document.getElementById('actionBtn');
                actionBtn.disabled = false;
                document.getElementById('btnText').innerText = "Скопировать отзыв и перейти";
            }
        }

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function capitalizeFirst(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

        function copyAndGo() {
            if (!selectedGender || !selectedDoctor) return;

            const btn = document.getElementById('actionBtn');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            if (btn.disabled) return;
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Формирую...";

            const genderData = (selectedGender === 'male') ? maleData : femaleData;
            const docTextArray = doctorTexts[selectedDoctor];

            const opening = getRandom(genderData.openings);
            const docText = getRandom(docTextArray);
            const closing = getRandom(genderData.closings);

            let fullReview = `${opening}, ${docText} ${closing}`;
            fullReview = capitalizeFirst(fullReview);

            navigator.clipboard.writeText(fullReview).then(() => {
                showToast();
                setTimeout(() => { window.location.href = targetUrl; }, 1500);
            }).catch(err => {
                alert("Скопируйте текст вручную:\n\n" + fullReview);
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Скопировать отзыв и перейти";
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }
    </script>
</body>
</html>
