<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в 2ГИС...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f0f0f0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        button { background-color: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Спасибо, что хотите оставить отзыв!</h2>
        <p>Нажмите кнопку ниже. Мы скопируем для вас уникальный текст отзыва и переведем в 2ГИС.</p>
        <button onclick="copyAndGo()">Скопировать отзыв и перейти</button>
    </div>

    <script>
        // Мы создаем массив объектов, где каждая процедура имеет свои уникальные детали и результаты.
        // Это гарантирует, что не будет логических нестыковок (например, "волосы" после "чистки лица").
        const reviewBlocks = [
            // Блок про чистку лица
            {
                starts: ["Запись на чистку лица прошла быстро,", "Чистку лица сделали аккуратно,", "На чистку лица приняли вовремя,"],
                middles: ["косметолог всё подробно объяснил,", "подобрали средства по типу кожи,", "процедура прошла совсем не больно,"],
                ends: ["кожа стала гладкой и чистой.", "поры очистились, лицо дышит.", "покраснение прошло к вечеру, кожа свежая."]
            },
            // Блок про пилинг лица
            {
                starts: ["Пилинг лица провели с учётом типа кожи,", "Пилинг с кислотой прошёл хорошо,", "Сделали пилинг для выравнивания тона,"],
                middles: ["врач подобрал нужный процент,", "немного жгло, но это терпимо,", "объяснили все нюансы процедуры,"],
                ends: ["кожа стала ровной и сияющей.", "через неделю лицо выглядит свежим.", "пигментные пятна стали бледнее."]
            },
            // Блок про лазерное удаление
            {
                starts: ["Лазерное удаление папиллом прошло быстро,", "Удаление бородавки сделали аккуратно,", "Лазерное удаление родинки прошло без боли,"],
                middles: ["обезболивание сработало отлично,", "врач всё сделал за пару минут,", "обработали кожу антисептиком,"],
                ends: ["заживление прошло гладко, следов почти нет.", "корочка сошла через неделю, кожа чистая.", "следов практически не осталось."]
            },
            // Блок про консультации (дерматолог, хирург, трихолог)
            {
                starts: ["Консультация дерматолога прошла внимательно,", "Приём у хирурга прошёл хорошо,", "Консультация трихолога прошла подробно,"],
                middles: ["врач осмотрел кожу и задал вопросы,", "все жалобы были выслушаны,", "показали состояние кожи на экране,"],
                ends: ["назначили грамотное лечение, высыпаний стало меньше.", "назначили курс процедур, стало легче.", "дали рекомендации по уходу, результат радует."]
            },
            // Блок про уколы (биоревитализация, ботокс, филлеры)
            {
                starts: ["Биоревитализацию сделали аккуратно,", "Уколы для увлажнения прошли комфортно,", "Инъекции в губы сделали естественно,"],
                middles: ["врач подробно рассказал о препарате,", "уколы почти не чувствовались,", "подобрали нужную дозировку,"],
                ends: ["кожа теперь увлажнённая и сияет.", "мелкие морщинки разгладились.", "губы выглядят натурально и ухоженно."]
            },
            // Блок про иглоукалывание (невролог)
            {
                starts: ["Иглоукалывание у невролога помогло,", "Записался на иглоукалывание по совету врача,", "Сеанс иглоукалывания прошёл спокойно,"],
                middles: ["нашлись нужные точки,", "врач профессионально работает с зонами напряжения,", "процедура прошла безболезненно,"],
                ends: ["головные боли прошли.", "снимает стресс, спится лучше.", "чувствуется легкость в шее и спине."]
            },
            // Блок про волосы (плазмотерапия, мезотерапия)
            {
                starts: ["Плазмотерапия для волос прошла комфортно,", "Сделали процедуру для укрепления волос,", "Процедура для волос прошла быстро,"],
                middles: ["врач всё объяснил по ходу,", "уколы в кожу головы терпимые,", "использовали витаминный состав,"],
                ends: ["волосы стали крепче и меньше выпадают.", "после курса волосы стали гуще.", "выпадение заметно сократилось."]
            },
            // Блок про пилинг спины
            {
                starts: ["Пилинг спины помог избавиться от высыпаний,", "Сделали кислотный пилинг на спине,", "Пилинг спины провели аккуратно,"],
                middles: ["подобрали нужный состав,", "кожа отреагировала хорошо,", "объяснили, как ухаживать дома,"],
                ends: ["кожа стала чище и глаже.", "воспаления прошли, спина выглядит лучше.", "результат радует, кожа гладкая."]
            }
        ];

        const targetUrl = "https://2gis.ru/surgut/firm/70000001075020592/tab/reviews";

        function copyAndGo() {
            // 1. Выбираем случайный блок (например, про чистку или про лазер)
            const randomBlock = reviewBlocks[Math.floor(Math.random() * reviewBlocks.length)];

            // 2. Внутри этого блока выбираем случайное начало, середину и конец
            const randomStart = randomBlock.starts[Math.floor(Math.random() * randomBlock.starts.length)];
            const randomMiddle = randomBlock.middles[Math.floor(Math.random() * randomBlock.middles.length)];
            const randomEnd = randomBlock.ends[Math.floor(Math.random() * randomBlock.ends.length)];

            // 3. Склеиваем и делаем первую букву заглавной
            let fullReview = randomStart + " " + randomMiddle + " " + randomEnd;
            fullReview = fullReview.charAt(0).toUpperCase() + fullReview.slice(1);

            navigator.clipboard.writeText(fullReview).then(() => {
                window.location.href = targetUrl;
            }).catch(err => {
                alert("Не удалось скопировать текст. Пожалуйста, скопируйте вручную: " + fullReview);
            });
        }
    </script>
</body>
</html>
